<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDY BLOOM</title>
<!--
  ═══════════════════════════════════════════════════════════
   📚 STUDY BLOOM — PDF 기반 올인원 인터랙티브 학습 웹앱
   단일 파일 구성:  ① 스타일(CSS)  ② 화면 틀(HTML)  ③ 기능(JS)
   - JS 안에서 "/* ===== [섹션 이름] ===== */" 주석으로 구역을 나눴어요.
   - 색상은 :root 의 --cream, --pink ... 변수만 바꾸면 전체가 바뀝니다.
   - 데이터는 브라우저 IndexedDB에 저장됩니다. (설정 > JSON 백업 권장)
  ═══════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* ===== ① 색상 · 기본 ===== */
:root{
  --cream:#FFF9F1; --pink:#FFDCE8; --lav:#E9DFFF; --blue:#DCEFFF; --mint:#DDF5E9; --butter:#FFF1BD; --cocoa:#665A60;
  --pink-d:#F59BBB; --lav-d:#A98BEB; --blue-d:#7DB6E8; --mint-d:#6CC79B; --butter-d:#E9C24B; --red-s:#F28B8B;
  --ink:#4E4448; --muted:#9A8E93; --line:#F1E4DA; --white:#fff;
  --r:22px; --shadow:0 4px 0 rgba(102,90,96,.07), 0 8px 22px rgba(102,90,96,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Gowun Dodum',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6;
  background-image:radial-gradient(#F6E7DA 1.2px,transparent 1.2px);background-size:22px 22px}
h1,h2,h3,h4,.jua{font-family:'Jua',sans-serif;font-weight:400;color:var(--cocoa);margin:.2em 0 .5em}
h1{font-size:26px} h2{font-size:22px} h3{font-size:18px} h4{font-size:16px}
a{color:#B0648A}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input,select,textarea{border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:#fff;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--pink-d)}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.7}
label{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12.5px} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1} .between{justify-content:space-between} .gap16{gap:16px}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ===== 버튼 ===== */
.btn{border:none;border-radius:999px;padding:9px 18px;background:var(--pink);color:var(--cocoa);cursor:pointer;font-family:'Jua',sans-serif;font-size:15px;
  box-shadow:0 3px 0 rgba(102,90,96,.13);transition:transform .12s, box-shadow .12s, filter .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.03);transform:translateY(-1px)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(102,90,96,.13)}
.btn.lav{background:var(--lav)} .btn.blue{background:var(--blue)} .btn.mint{background:var(--mint)} .btn.butter{background:var(--butter)}
.btn.white{background:#fff;border:2px solid var(--line)} .btn.ghost{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.btn.strong{background:var(--pink-d);color:#fff} .btn.sm{padding:5px 12px;font-size:13px} .btn.xs{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:var(--lav);font-size:12px;color:var(--cocoa);white-space:nowrap}
.chip.pink{background:var(--pink)} .chip.blue{background:var(--blue)} .chip.mint{background:var(--mint)} .chip.butter{background:var(--butter)} .chip.white{background:#fff;border:1px solid var(--line)}
.chip.warn{background:#FFE1D6;color:#A2553C}
.pg{cursor:pointer;background:var(--butter);border-radius:8px;padding:0 6px;font-size:12px;font-family:'Jua';color:var(--cocoa);white-space:nowrap}
.pg:hover{background:var(--butter-d);color:#fff}

/* ===== 레이아웃 ===== */
#app{display:flex;min-height:100vh}
#side{width:228px;flex-shrink:0;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border-right:2px solid var(--line);padding:16px 12px 120px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
#side .logo{display:flex;align-items:center;gap:8px;padding:4px 8px 16px}
#side .logo b{font-family:'Jua';font-size:22px;color:var(--pink-d);letter-spacing:.5px}
.nav{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:16px;cursor:pointer;color:var(--cocoa);margin-bottom:2px;font-size:14.5px}
.nav:hover{background:var(--cream)} .nav.on{background:var(--pink);font-family:'Jua';font-size:15.5px}
.nav .e{width:24px;text-align:center;font-size:17px}
#main{flex:1;min-width:0;padding:22px 26px 90px}
#topbar{display:none}
@media(max-width:860px){
  #side{position:fixed;left:-240px;transition:left .25s;box-shadow:var(--shadow)} #side.open{left:0}
  #topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:25}
  #main{padding:16px 14px 90px}
}
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;border:2px solid #fff}
.card.tape::before{content:"";position:absolute;top:-9px;left:50%;width:74px;height:18px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,220,232,.85);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.tape.t-lav::before{background:rgba(233,223,255,.9)} .card.tape.t-mint::before{background:rgba(221,245,233,.95)} .card.tape.t-blue::before{background:rgba(220,239,255,.95)} .card.tape.t-butter::before{background:rgba(255,241,189,.95)}
.card.pinkbg{background:var(--pink)} .card.lavbg{background:var(--lav)} .card.mintbg{background:var(--mint)} .card.bluebg{background:var(--blue)} .card.butterbg{background:var(--butter)}
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-title h1{margin:0}
.stat{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:18px;background:var(--cream);min-width:84px}
.stat b{font-family:'Jua';font-size:21px;color:var(--cocoa)} .stat span{font-size:12px;color:var(--muted)}
.bar{height:12px;background:var(--cream);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-d),var(--lav-d));border-radius:999px;transition:width .5s}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);background:rgba(255,255,255,.6)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--cream);margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 15px;border-radius:999px;background:#fff;cursor:pointer;border:2px solid var(--line);font-size:14px}
.tab.on{background:var(--lav);border-color:var(--lav);font-family:'Jua'}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{background:var(--lav);font-family:'Jua';font-weight:400;padding:8px;text-align:left;color:var(--cocoa)}
table.t th:first-child{border-radius:12px 0 0 12px} table.t th:last-child{border-radius:0 12px 12px 0}
table.t td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:top}
.evidence{background:var(--cream);border-left:4px solid var(--butter-d);padding:8px 12px;border-radius:0 12px 12px 0;font-size:13.5px;margin:6px 0}
.ai-note{background:#F3EEFF;border-left:4px solid var(--lav-d);padding:8px 12px;border-radius:0 12px 12px 0;font-size:13.5px;margin:6px 0}
.ai-note::before{content:"🤖 AI 생성 설명 · 원문 외 일반 지식이 섞일 수 있어요";display:block;font-size:11.5px;color:var(--lav-d);font-family:'Jua'}
.kw{background:linear-gradient(transparent 55%,var(--butter) 55%);font-weight:bold}
mark{background:var(--butter);border-radius:4px;padding:0 2px}

/* ===== 모달 · 토스트 ===== */
#modal{position:fixed;inset:0;background:rgba(102,90,96,.32);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal .box{background:#fff;border-radius:26px;max-width:min(920px,100%);width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.18);position:relative;animation:pop .25s}
#modal .x{position:absolute;right:14px;top:12px;border:none;background:var(--cream);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#fff;border-radius:18px;padding:10px 16px;box-shadow:var(--shadow);border:2px solid var(--pink);animation:pop .3s;max-width:320px;font-size:14px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* ===== 마스코트 도크 ===== */
#dock{position:fixed;left:16px;bottom:12px;z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
@media(max-width:860px){#dock{left:8px}}
#dock .m{pointer-events:auto;cursor:pointer}
#dock .bubble{pointer-events:auto;background:#fff;border-radius:18px;padding:9px 14px;box-shadow:var(--shadow);max-width:270px;font-size:13.5px;margin-bottom:46px;position:relative;border:2px solid var(--pink)}
#dock .bubble::after{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--pink);border-left:0}
.bob{animation:bob 2.6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-5px)}}
.jump{animation:jump .6s} @keyframes jump{30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.wiggle{animation:wig .5s} @keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}

/* ===== 플래시카드 ===== */
.fc-wrap{perspective:1200px;max-width:560px;margin:0 auto}
.fc{position:relative;height:320px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow);border:3px solid #fff;overflow:auto}
.fc .back{transform:rotateY(180deg)}
.fc .face .q{font-family:'Jua';font-size:22px;color:var(--cocoa)} .fc .face .a{font-size:16.5px;line-height:1.75}
.fc .hole{position:absolute;top:14px;left:18px;width:16px;height:16px;border-radius:50%;background:var(--cream);box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
.fc .stk{position:absolute;right:16px;top:12px;font-size:22px}

/* ===== 퀴즈 ===== */
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;margin-bottom:8px;transition:all .15s;text-align:left;width:100%}
.opt:hover{border-color:var(--pink-d)} .opt.sel{border-color:var(--lav-d);background:#F6F1FF}
.opt.right{border-color:var(--mint-d);background:var(--mint)} .opt.wrong{border-color:var(--red-s);background:#FFECEC}
.opt .no{font-family:'Jua';min-width:26px;height:26px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dragitem{padding:7px 13px;background:var(--butter);border-radius:12px;cursor:grab;user-select:none;display:inline-block;margin:4px;font-size:14px;border:2px solid transparent}
.dragitem.picked{border-color:var(--lav-d)}
.bucket{min-height:90px;border:2px dashed var(--lav-d);border-radius:18px;padding:8px;background:#FBF8FF}
.bucket.over{background:var(--lav)}
.feedback{border-radius:18px;padding:14px 16px;margin-top:12px;animation:pop .25s}
.feedback.ok{background:var(--mint)} .feedback.no{background:#FFF0F3}
.combo{font-family:'Jua';color:var(--pink-d);font-size:18px}

/* ===== 시험 모드(장식 최소화) ===== */
body.exam-mode{background:#FAFAF8;background-image:none}
body.exam-mode #side,body.exam-mode #dock,body.exam-mode #topbar{display:none!important}
body.exam-mode #main{padding:0}
.exam-head{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;align-items:center;gap:16px;z-index:10;font-family:system-ui,sans-serif}
.exam-body{display:flex;gap:18px;padding:18px 20px;max-width:1200px;margin:0 auto}
.exam-paper{flex:1;background:#fff;border:1px solid #ddd;border-radius:6px;padding:26px 30px;font-family:'Gowun Dodum',serif;min-height:60vh}
.exam-paper .opt{border-radius:6px;border-width:1px}
.exam-side{width:230px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px;align-self:flex-start;position:sticky;top:70px}
.qnum{display:inline-flex;width:36px;height:36px;margin:3px;border-radius:6px;border:1px solid #ccc;align-items:center;justify-content:center;cursor:pointer;font-size:13px;position:relative;background:#fff}
.qnum.done{background:#E8F1FB;border-color:#7DB6E8} .qnum.cur{outline:2px solid #333} .qnum.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#F2A33A}
.ebtn{border:1px solid #bbb;background:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px} .ebtn.primary{background:#333;color:#fff;border-color:#333}
@media(max-width:800px){.exam-body{flex-direction:column}.exam-side{width:100%;position:static}}

/* ===== 만화 · 애니메이션 ===== */
.comic{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{position:relative;aspect-ratio:4/3;border:2.5px solid var(--cocoa);border-radius:18px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:4px 4px 0 rgba(102,90,96,.12);transition:transform .2s}.panel:hover{transform:rotate(-.4deg) scale(1.01)}
.panel svg.bg{position:absolute;inset:0;width:100%;height:100%}
.panel .no{position:absolute;left:8px;top:6px;font-family:'Jua';font-size:13px;background:#fff;border-radius:8px;padding:0 6px;z-index:3}
.panel .narr{position:absolute;left:44px;top:7px;background:var(--butter);font-size:12px;padding:2px 10px;border-radius:999px;z-index:3;border:1.5px solid var(--cocoa);font-family:'Jua'}
.sb{position:absolute;background:#fff;border:2px solid var(--cocoa);border-radius:16px;padding:6px 11px;font-size:13px;line-height:1.45;z-index:4;max-width:58%;box-shadow:2px 3px 0 rgba(102,90,96,.1)}
.sb::after{content:"";position:absolute;bottom:-9px;left:22px;border:8px solid transparent;border-top-color:var(--cocoa);border-bottom:0}
.sb.r::after{left:auto;right:22px}
.sb b.who{font-family:'Jua';font-size:11.5px;color:var(--pink-d);display:block}
.panel .ch{position:absolute;bottom:5%;z-index:2}.panel .ch::after{content:"";position:absolute;left:18%;right:18%;bottom:2%;height:8%;background:rgba(102,90,96,.18);border-radius:50%;z-index:-1}
.comic.one{grid-template-columns:1fr;max-width:640px;margin:0 auto}
.stage{position:relative;aspect-ratio:16/9;background:linear-gradient(#DCEFFF 0%,#FFF6EC 60%,#F6E3D2 60%,#F1DAC6 100%);border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow)}
.stage:fullscreen{border-radius:0}
.stage .scene{position:absolute;inset:0}
.stage .caption{position:absolute;left:50%;transform:translateX(-50%);bottom:3%;max-width:86%;background:rgba(78,68,72,.82);color:#fff;padding:6px 18px;font-size:15px;text-align:center;z-index:9;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.stage.paused *{animation-play-state:paused!important}
.a-in-l{animation:inl .8s both} @keyframes inl{from{transform:translateX(-140%);opacity:0}}
.a-in-r{animation:inr .8s both} @keyframes inr{from{transform:translateX(140%);opacity:0}}
.a-pop{animation:apop .5s both} @keyframes apop{from{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}}
.a-up{animation:aup .6s both} @keyframes aup{from{transform:translateY(30px);opacity:0}}
.a-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s forwards} @keyframes draw{to{stroke-dashoffset:0}}
.a-talk{animation:talk .35s ease-in-out infinite alternate} @keyframes talk{to{transform:translateY(-4px)}}
.stepbox{position:absolute;background:#fff;border-radius:16px;padding:8px 12px;border:2.5px solid var(--lav-d);font-size:14px;text-align:center;box-shadow:var(--shadow)}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* ===== 공부방(꾸미기) ===== */
.room{position:relative;width:100%;aspect-ratio:16/10;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:3px solid #fff}
.shopitem{text-align:center;padding:12px}
.shopitem .ic{font-size:40px;height:56px;display:flex;align-items:center;justify-content:center}

/* ===== 달력 ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1/1;border-radius:12px;background:var(--cream);font-size:12px;padding:3px 5px;position:relative;cursor:pointer;overflow:hidden}
.cal .d.h{background:transparent;text-align:center;font-family:'Jua';color:var(--muted);aspect-ratio:auto;cursor:default}
.cal .d.today{outline:2px solid var(--pink-d)} .cal .d.out{opacity:.35}
.cal .d .dot{position:absolute;bottom:4px;left:5px;right:5px;display:flex;gap:2px;flex-wrap:wrap}
.cal .d .dot i{width:6px;height:6px;border-radius:50%;background:var(--pink-d)} .cal .d .dot i.r{background:var(--lav-d)} .cal .d .dot i.x{background:var(--butter-d)}
.cal .d.sel{background:var(--lav)}
.cal.big .d{aspect-ratio:auto;min-height:74px}

/* ===== PDF 뷰어 ===== */
.pdfview canvas{max-width:100%;border-radius:10px;box-shadow:var(--shadow);background:#fff}
.pagetext{white-space:pre-wrap;font-size:13.5px;background:var(--cream);padding:14px;border-radius:14px;max-height:60vh;overflow:auto;line-height:1.75}
.drop{border:3px dashed var(--pink-d);border-radius:26px;padding:34px;text-align:center;background:rgba(255,255,255,.7);cursor:pointer;transition:all .2s}
.drop.over{background:var(--pink);transform:scale(1.01)}
.prog{font-size:13px;color:var(--muted)}
.mapsvg text{font-family:'Gowun Dodum';font-size:12px;fill:var(--ink)}

/* ===== 다듬기: 캐릭터 깜빡임 · 그림자 · 카드 · 사이드바 ===== */
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.actor{position:absolute;z-index:3}
.actor svg,.panel .ch svg{width:100%;height:auto;display:block}
.actor::after{content:"";position:absolute;left:22%;right:22%;bottom:-2%;height:7%;background:rgba(102,90,96,.16);border-radius:50%;z-index:-1}
.idle{animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3%) rotate(-1.5deg)}}
.talk{animation:talk2 .9s ease-in-out infinite}
@keyframes talk2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4%) scale(1.02,.98)}}
.walk-l{animation:walkl 1.1s cubic-bezier(.3,.8,.4,1) both}@keyframes walkl{0%{transform:translateX(-160%)}20%{transform:translateX(-120%) translateY(-6%)}40%{transform:translateX(-80%)}60%{transform:translateX(-40%) translateY(-6%)}100%{transform:none}}

<script>
/* ===================================================================
   ③ 기능(JS)
   =================================================================== */

/* ===== [1] 작은 도구들 ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const z2 = n => String(n).padStart(2, '0');
const dateKey = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const today = () => dateKey(new Date());
const addDays = (key, n) => { const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return dateKey(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s || '').replace(/\s+/g, '').replace(/[·‧∙.,'"‘’“”()\[\]{}<>「」『』:;!?~\-–—_/]/g, '').toLowerCase();
const fmtTime = s => { s = Math.max(0, Math.round(s)); return z2(Math.floor(s / 60)) + ':' + z2(s % 60); };
// 받침 여부로 은/는, 이/가, 을/를, 과/와 선택 (영문 등은 '은(는)')
const J = (w, pair) => { const [a, b] = pair.split('/'); const ch = String(w).trim().slice(-1); const c = ch.charCodeAt(0); if (c >= 0xAC00 && c <= 0xD7A3) return w + ((c - 0xAC00) % 28 ? a : b); return w + a + '(' + b + ')'; };

/* ===== [2] 저장소 (IndexedDB) ===== */
const DB = {
  db: null, ok: false,
  open() { return new Promise(res => { try { const r = indexedDB.open('studybloom', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; this.ok = true; res(true); }; r.onerror = () => res(false); } catch (e) { res(false); } }); },
  get(k) { return new Promise(res => { if (!this.db) return res(null); try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); } }); },
  set(k, v) { return new Promise(res => { if (!this.db) return res(false); try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); } }); },
  del(k) { return new Promise(res => { if (!this.db) return res(false); try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(true); } catch (e) { res(false); } }); }
};

/* ===== [3] 앱 상태 ===== */
function defaultState() {
  return {
    v: 1,
    profile: { nick: '공부하는 나', goal: '오늘의 목표를 적어 보세요', stars: 0, xp: 0, examDate: '', lastDoc: null, lastView: 'home',
      owned: ['desk_basic', 'chair_basic', 'wall_cream'], placed: { desk: 'desk_basic', chair: 'chair_basic', wall: 'wall_cream' }, outfit: '', badges: [] },
    studyLog: {},      // { '2026-11-11': { total: 분, bySubject: {과목: 분} } }
    activity: {},      // { 날짜: 활동 수 }
    docs: [],          // 업로드한 PDF 정보 + 페이지 텍스트 + 단원 + 개념
    cards: [],         // 플래시카드
    questions: [],     // 문제 은행
    quizLog: [],       // 문제 풀이 기록
    exams: [],         // 모의시험
    recalls: [],       // 백지 복습
    wrongs: [],        // 오답 기록
    reviews: {},       // 개념별 복습 일정 { conceptId: { due, stage, history:[], docId } }
    reviewDone: {},    // { 날짜: [conceptId] }
    comics: {},        // 개념별 AI 만화 각본
    aiNotes: {}        // 개념별 AI 설명 캐시
  };
}
let S = defaultState();
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => DB.set('state', S), 400); }
async function load() {
  await DB.open();
  const st = await DB.get('state');
  if (st && st.v) { S = Object.assign(defaultState(), st); S.profile = Object.assign(defaultState().profile, st.profile || {}); }
}

/* 조회 도우미 */
const docById = id => S.docs.find(d => d.id === id);
const allConcepts = () => S.docs.flatMap(d => d.concepts || []);
const conceptById = id => { for (const d of S.docs) { const c = (d.concepts || []).find(c => c.id === id); if (c) return c; } return null; };
const docConcepts = (docId, unitIds) => { const d = docById(docId); if (!d) return []; let cs = d.concepts || []; if (unitIds && unitIds.length) cs = cs.filter(c => unitIds.includes(c.unitId)); return cs; };
const unitById = (doc, id) => (doc?.units || []).find(u => u.id === id);
const curDoc = () => docById(S.profile.lastDoc) || S.docs[0] || null;

/* ===== [4] AI 연결 (claude.ai 아티팩트에서 실행될 때만 작동) =====
   다른 곳(내 컴퓨터, GitHub Pages)에서 열면 AI 없이 '규칙 기반 분석'으로 작동합니다. */
const AI = {
  fn: null, ready: false, checked: false,
  async init() {
    try { if (window.claude && typeof window.claude.use === 'function') { const s = await window.claude.use('sample'); if (s) { this.fn = s; this.ready = true; } } } catch (e) {}
    this.checked = true; renderAIBadge();
  },
  async ask(prompt, opts = {}) {
    if (!this.fn) throw new Error('AI가 연결되어 있지 않아요');
    const o = { modelTier: opts.tier || 'default', cache: false };
    if (opts.images) o.images = opts.images;
    try { const r = await this.fn(prompt, o); return r.text || ''; }
    catch (e) { if (e && e.code === 'not_granted') { this.ready = false; this.fn = null; renderAIBadge(); } throw new Error(e?.message || 'AI 요청 실패'); }
  },
  async json(prompt, opts) {
    const t = await this.ask(prompt + '\n\n반드시 JSON만 출력하세요. 설명 문장이나 ``` 표시 없이.', opts);
    return parseJSONLoose(t);
  }
};
function parseJSONLoose(t) {
  t = String(t).replace(/```json|```/g, '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const s = Math.min(...['{', '['].map(c => t.indexOf(c)).filter(i => i >= 0));
  const e2 = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (s >= 0 && e2 > s) { try { return JSON.parse(t.slice(s, e2 + 1)); } catch (e) {} }
  throw new Error('AI 응답을 해석하지 못했어요');
}
function renderAIBadge() {
  const el = $('#aiBadge'); if (!el) return;
  el.innerHTML = AI.ready ? '🤖 <b style="color:var(--mint-d)">AI 연결됨</b><br><span class="muted">분석·채점·OCR에 AI 사용</span>'
    : (AI.checked ? '🤖 AI 미연결<br><span class="muted">규칙 기반 분석으로 작동</span>' : '🤖 AI 연결 확인 중…');
}

/* ===== [6] UI 도우미 ===== */
const UI = {
  open(html, wide) { $('#modalBody').innerHTML = html; $('#modal .box').style.maxWidth = wide ? 'min(1100px,100%)' : ''; $('#modal').classList.remove('hidden'); },
  close() { $('#modal').classList.add('hidden'); $('#modalBody').innerHTML = ''; if (UI.onClose) { const f = UI.onClose; UI.onClose = null; f(); } },
  toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms); },
  confirm(msg, onYes, yes = '확인') { UI.open(`<h3>확인해 주세요</h3><p>${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn white" onclick="UI.close()">취소</button><button class="btn strong" id="cfYes">${yes}</button></div>`); $('#cfYes').onclick = () => { UI.close(); onYes(); }; },
  promptText(title, val, onOk, multi) { UI.open(`<h3>${esc(title)}</h3>${multi ? `<textarea id="ptIn">${esc(val)}</textarea>` : `<input id="ptIn" style="width:100%" value="${esc(val)}">`}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn white" onclick="UI.close()">취소</button><button class="btn strong" id="ptOk">저장</button></div>`); $('#ptOk').onclick = () => { const v = $('#ptIn').value; UI.close(); onOk(v); }; },
  busy(msg) { UI.open(`<div class="center" style="padding:20px">${mascot('dubu', 'focus', 96, '', { pose: 'hold', prop: 'book', bulb: true })}<h3 id="busyMsg">${esc(msg)}</h3><div class="bar" style="max-width:360px;margin:10px auto"><i id="busyBar" style="width:5%"></i></div><p class="small muted" id="busySub"></p></div>`); },
  busyUpdate(msg, p, sub) { if ($('#busyMsg') && msg) $('#busyMsg').textContent = msg; if ($('#busyBar') && p != null) $('#busyBar').style.width = clamp(p, 2, 100) + '%'; if ($('#busySub') && sub != null) $('#busySub').textContent = sub; }
};
const pgLink = (docId, page, label) => page ? `<span class="pg" onclick="event.stopPropagation();openPdf('${docId}',${page})" title="원본 PDF 페이지 보기">${label || 'p.' + page}</span>` : '<span class="chip warn">페이지 미확인</span>';

/* ===== [7] 별 · 레벨 · 배지 · 공부 시간 ===== */
const level = () => 1 + Math.floor(Math.sqrt((S.profile.xp || 0) / 30));
function reward(stars, xp, why) {
  const before = level();
  S.profile.stars += stars; S.profile.xp += xp;
  S.activity[today()] = (S.activity[today()] || 0) + 1;
  if (level() > before) { UI.toast(`🎉 레벨 업! <b>Lv.${level()}</b>`); Dock.say('mochi', 'excited', `레벨 ${level()} 달성! 우리도 한 뼘 자랐어 🌱`, 5000, 'jump', { pose: 'jump' }); }
  checkBadges(); save(); refreshTopStats();
}
const BADGES = [
  { id: 'first_pdf', ic: '📁', name: '첫 자료 등록', test: () => S.docs.length >= 1 },
  { id: 'cards50', ic: '🃏', name: '카드 50장 복습', test: () => S.cards.reduce((a, c) => a + (c.total || 0), 0) >= 50 },
  { id: 'quiz100', ic: '🎮', name: '문제 100개 풀이', test: () => S.quizLog.length >= 100 },
  { id: 'combo10', ic: '🔥', name: '10콤보 달성', test: () => (S.profile.bestCombo || 0) >= 10 },
  { id: 'exam1', ic: '📝', name: '첫 모의시험 완료', test: () => S.exams.some(e => e.status === 'done') },
  { id: 'exam90', ic: '🏆', name: '모의시험 90점 이상', test: () => S.exams.some(e => e.status === 'done' && pct(e.score, e.max) >= 90) },
  { id: 'recall1', ic: '✏️', name: '첫 백지 복습', test: () => S.recalls.length >= 1 },
  { id: 'streak3', ic: '🌷', name: '3일 연속 공부', test: () => streak() >= 3 },
  { id: 'streak7', ic: '🌸', name: '7일 연속 공부', test: () => streak() >= 7 },
  { id: 'fix10', ic: '🔎', name: '오답 10개 해결', test: () => S.wrongs.filter(w => w.resolved).length >= 10 }
];
function checkBadges() {
  for (const b of BADGES) if (!S.profile.badges.includes(b.id) && b.test()) { S.profile.badges.push(b.id); S.profile.stars += 5; UI.toast(`${b.ic} 배지 획득: <b>${b.name}</b> (+5⭐)`, 3500); if (typeof celebrate === 'function') celebrate(20); if (b.id.startsWith('streak')) setTimeout(() => Dock.say('mochi', 'cheer', `${b.name}! 깃발 흔들기 🚩 우리 계속 가 보자!`, 5000, 'jump', { pose: 'cheer', prop: 'flag' }), 400); }
}
function streak() {
  let n = 0, d = today();
  const active = k => (S.activity[k] || 0) > 0 || (S.studyLog[k]?.total || 0) > 0;
  if (!active(d)) d = addDays(d, -1);
  while (active(d)) { n++; d = addDays(d, -1); }
  return n;
}
/* 실제로 화면을 사용 중일 때만 1분씩 공부 시간 기록 */
let lastInteract = Date.now(), contMinutes = 0;
['click', 'keydown', 'scroll', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { lastInteract = Date.now(); }, { passive: true }));
setInterval(() => {
  if (document.hidden || Date.now() - lastInteract > 120000) { if (Date.now() - lastInteract > 600000) contMinutes = 0; return; }
  const k = today(), doc = curDoc(), subj = doc?.subject || '기타';
  const L = S.studyLog[k] || (S.studyLog[k] = { total: 0, bySubject: {} });
  L.total++; L.bySubject[subj] = (L.bySubject[subj] || 0) + 1;
  contMinutes++; save();
  if (contMinutes > 0 && contMinutes % 50 === 0 && $('#restToggle')?.checked) Dock.say('mochi', 'sleepy', '50분 동안 열심히 했어! 5~10분 쉬면서 스트레칭하자 🧸', 9000, 'wiggle', { pose: 'idle' });
}, 60000);
</script>
<script>

  if (q <= 0) R.stage = 0; else if (q === 1) R.stage = Math.max(0, R.stage); else R.stage = Math.min(base.length - 1, Math.max(0, R.stage) + (q === 3 ? 2 : 1));
  const days = R.stage >= base.length - 1 && q >= 2 ? Math.round(base[base.length - 1] * (1 + (R.history.filter(h => h.q >= 2).length - 4) * 0.25)) : base[R.stage];
  R.due = addDays(today(), Math.max(1, days));
}

  const c = conceptById(cid); if (!c) return;
  S.wrongs.push(Object.assign({ id: uid(), conceptId: cid, docId: c.docId, source, type, detail, t: Date.now(), resolved: false }, extra || {}));
  touchReview(cid, 0);
}

/* 개념별 기억 안정화 추정 (0~100): 카드 단계 + 최근 정답률 + 오답 */
function memoryScore(cid) {
  const cards = S.cards.filter(c => c.conceptId === cid && c.total);
  const logs = S.quizLog.filter(l => l.conceptId === cid).slice(-10);
  if (!cards.length && !logs.length) return null;
  const st = cards.length ? cards.reduce((a, c) => a + Math.max(0, c.stage + 1), 0) / cards.length / LADDER.length : 0.3;
  const acc = logs.length ? logs.filter(l => l.correct).length / logs.length : (cards.length ? cards.reduce((a, c) => a + c.correct / c.total, 0) / cards.length : 0.5);
  return clamp(Math.round((st * 0.45 + acc * 0.55) * 100 - wrongCount(cid) * 6), 0, 100);
}

/* ===== [13] AI 고난도 문제 생성 + 별도 검증 ===== */
async function aiMakeQuestions(doc, concepts, n, level, onProg) {
  const ctxPages = [...new Set(concepts.map(c => c.page))].slice(0, 8).map(pn => doc.pages.find(p => p.n === pn)).filter(Boolean);
  const prompt = `너는 대학 전공시험·교원임용시험 출제위원이다. 아래 [개념]과 [원문]만 근거로 LV.${level} ${level >= 5 ? '여러 개념을 연결한 심화 추론' : '실제 사례에 개념을 적용하는 응용'} 객관식 문제 ${n}개를 만든다.
원칙: 원문으로 정답을 확인할 수 있어야 한다 / 정답은 반드시 하나 / 오답도 그럴듯하게 / 정답 단서(길이·표현 반복) 제거 / 지엽적 암기나 어려운 단어로 난이도를 올리지 않는다 / 사례는 가상의 학교·생활 상황.
출력: {"questions":[{"type":"case","prompt":"사례와 질문","options":["5개 선택지"],"answer":0,"explanation":"정답 해설","whyWrong":["각 선택지가 왜 틀렸는지(정답 칸은 빈 문자열)"],"concepts":["관련 개념명"],"page":숫자,"quote":"근거 원문 문장 그대로"}]}

[개념]
${concepts.map(c => `- ${c.name} (p.${c.page}): ${c.definition}`).join('\n')}

[원문]
${ctxPages.map(p => `[p.${p.n}]\n${p.text.slice(0, 3000)}`).join('\n')}`;
  const r = await AI.json(prompt, { tier: 'complex' });
  const made = [], qs = r.questions || [];
  for (let i = 0; i < qs.length; i++) {
    const q = qs[i]; onProg && onProg(i, qs.length);
    if (!Array.isArray(q.options) || q.options.length < 4 || !(q.answer >= 0 && q.answer < q.options.length)) continue;
    const v = verifyQuote(doc, q.quote || '', +q.page); if (!v.ok) continue;
    // 별도 검증: 다른 요청으로 문제를 독립적으로 풀게 해서 정답·유일성 확인
    try {
      const pg = doc.pages.find(p => p.n === v.page);
      const chk = await AI.json(`다음 객관식 문제를 [원문]만 근거로 독립적으로 풀어라.
출력: {"answer":정답 번호(0부터),"unique":정답이 하나뿐이면 true,"supported":원문으로 정답 확인이 가능하면 true,"note":"짧은 이유"}
[문제] ${q.prompt}
${q.options.map((o, k) => `${k}) ${o}`).join('\n')}
[원문 p.${v.page}] ${pg ? pg.text.slice(0, 3500) : ''}`, { tier: 'default' });
      if (+chk.answer !== +q.answer || chk.unique === false || chk.supported === false) continue;
    } catch (e) { continue; }
    const cids = (q.concepts || []).map(nm => concepts.find(c => norm(c.name) === norm(nm))?.id).filter(Boolean);
    made.push({ id: uid(), docId: doc.id, conceptId: cids[0] || concepts[0].id, conceptIds: cids.length ? cids : [concepts[0].id], type: 'case', level, prompt: q.prompt, options: q.options, answer: +q.answer, explanation: q.explanation || '', whyWrongList: q.whyWrong || [], page: v.page, evidence: q.quote, src: 'ai', verified: true });
  }
  S.questions.push(...made); save();
  return made.length;
}

function barChart(items, unit, color = 'var(--pink-d)', h = 120) {
  if (!items.some(i => i.v > 0)) return '<div class="empty small">아직 기록이 없어요</div>';
  const max = Math.max(...items.map(i => i.v), 1), w = 100 / items.length;
  return `<svg viewBox="0 0 100 ${h / 3 + 12}" style="width:100%;height:${h}px" preserveAspectRatio="none">${items.map((it, i) => { const bh = (it.v / max) * (h / 3 - 4); return `<rect x="${i * w + w * .18}" y="${h / 3 - bh}" width="${w * .64}" height="${bh}" rx="1.5" fill="${color}" opacity=".85"><title>${it.label}: ${it.v}${unit}</title></rect>`; }).join('')}</svg>
  <div style="display:flex">${items.map(it => `<div style="flex:1;text-align:center;font-size:10.5px" class="muted">${it.label}<br><b style="color:var(--cocoa)">${it.v}</b></div>`).join('')}</div>`;
}
function lineChart(points, max = 100, label = '') {
  if (points.length < 1) return '<div class="empty small">아직 기록이 없어요</div>';
  const W = 300, H = 110, n = points.length; const x = i => n === 1 ? W / 2 : 14 + i * (W - 28) / (n - 1), y = v => H - 14 - (v / max) * (H - 28);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px"><line x1="10" y1="${y(0)}" x2="${W - 10}" y2="${y(0)}" stroke="#F1E4DA"/><line x1="10" y1="${y(max / 2)}" x2="${W - 10}" y2="${y(max / 2)}" stroke="#F1E4DA" stroke-dasharray="3"/>
    <polyline fill="none" stroke="var(--lav-d)" stroke-width="2.5" stroke-linejoin="round" points="${points.map((p, i) => x(i) + ',' + y(p.v)).join(' ')}"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#fff" stroke="var(--pink-d)" stroke-width="2"><title>${esc(p.label)}: ${p.v}${label}</title></circle><text x="${x(i)}" y="${y(p.v) - 8}" font-size="9" text-anchor="middle" fill="#665A60">${p.v}</text>`).join('')}</svg>`;
}

function setRange(id, k, v) { const d = docById(id); d.range = d.range || {}; d.range[k] = v ? +v : null; save(); UI.toast('시험 범위를 저장했어요. 퀴즈·시험·카드 생성에 반영하려면 ‘학습 콘텐츠 다시 만들기’를 눌러 주세요.', 3500); }
function deleteDoc(id) { UI.confirm('이 PDF와 관련 문제·카드·기록을 삭제할까요? (되돌릴 수 없어요)', async () => { const cids = new Set((docById(id)?.concepts || []).map(c => c.id)); S.docs = S.docs.filter(d => d.id !== id); S.questions = S.questions.filter(q => q.docId !== id); S.cards = S.cards.filter(c => c.docId !== id); S.wrongs = S.wrongs.filter(w => w.docId !== id); cids.forEach(c => delete S.reviews[c]); delete PDFC[id]; await DB.del('pdf:' + id); save(); render(); }, '삭제'); }
$('#fileIn').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) processFiles(fs, replaceTarget); replaceTarget = null; });

async function processFiles(files, replaceId) {
  if (!pdfReady()) { UI.open('<h3>PDF 도구를 불러오지 못했어요</h3><p>인터넷 연결을 확인하고 새로고침해 주세요. (PDF.js는 cdnjs에서 불러옵니다)</p>'); return; }
  const useAI = AI.ready && ($('#useAI')?.checked ?? true);
  let lastId = null;
  for (let fi = 0; fi < files.length; fi++) {
    const f = files[fi], tag = files.length > 1 ? `(${fi + 1}/${files.length}) ` : '';
    UI.busy(tag + `「${f.name}」 여는 중…`);
    try {
      const buf = await f.arrayBuffer();
      const pdf = await openPdfData(buf);
      let doc = replaceId ? docById(replaceId) : null;
      if (!doc) { doc = { id: uid(), name: f.name.replace(/\.pdf$/i, ''), subject: $('#upSubject')?.value.trim() || '', range: {}, pages: [], units: [], concepts: [], createdAt: Date.now() }; S.docs.push(doc); }
      else { doc.name = f.name.replace(/\.pdf$/i, ''); doc.replacedAt = Date.now(); }
      await DB.set('pdf:' + doc.id, buf.slice(0)); PDFC[doc.id] = pdf;
      doc.pages = await extractPages(pdf, (i, n) => UI.busyUpdate(tag + `텍스트 추출 중… ${i}/${n}쪽`, i / n * 40, '대용량 PDF는 시간이 조금 걸려요'));
      if (doc.pages.some(p => p.status === 'scan')) await ocrPages(doc, (i, n, pn) => UI.busyUpdate(tag + `스캔 페이지 판독(OCR) ${i + 1}/${n} (p.${pn})`, 40 + i / n * 15, AI.ready ? 'AI가 이미지를 읽고 있어요' : ''));
      await analyzeDoc(doc, useAI, tag);
      lastId = doc.id; S.profile.lastDoc = doc.id;
      reward(3, 10); save();
    } catch (e) { console.error(e); UI.close(); UI.open(`<h3>「${esc(f.name)}」를 처리하지 못했어요</h3><p class="muted">${esc(e.message || e)}</p><p class="small">암호가 걸린 PDF이거나 손상된 파일일 수 있어요.</p>`); return; }
  }
  UI.close();
  Dock.say('dubu', 'happy', '분석이 끝났어요! 단원과 개념이 맞는지 확인하고 고쳐 주세요 ✍️', 6000);
  go('library', { review: lastId });
}
async function analyzeDoc_old(doc, useAI, tag = '') {
  UI.busyUpdate(tag + '단원과 핵심 개념을 찾는 중…', 58, '정의 문장·제목·번호 목록을 분석해요');
  const rule = ruleAnalyze(doc);
  let units = rule.units, concepts = rule.concepts; doc.analyzedBy = 'rule'; doc.examPoints = []; doc.aiError = '';
  if (useAI && AI.ready) {
    const ai = await aiAnalyze(doc, (b, n) => UI.busyUpdate(tag + `AI 정밀 분석 중… ${b}/${n} 묶음`, 60 + (n ? b / n : 1) * 30, '단원별로 차례차례 분석하고, 인용 문장을 원문과 대조해요'));
    if (ai.concepts.length) {
      const names = new Set(ai.concepts.map(c => norm(c.name)));
      concepts = [...ai.concepts, ...rule.concepts.filter(c => !names.has(norm(c.name)))];
      if (ai.units.length) units = ai.units;
      doc.analyzedBy = 'ai'; doc.examPoints = ai.examPoints; if (ai.subject && !doc.subject) doc.subject = ai.subject;
    }
    if (ai.error) doc.aiError = ai.error;
  }
  // 개념 → 단원 연결 (페이지 기준 가장 가까운 앞 단원)
  const sortedU = [...units].sort((a, b) => a.page - b.page);
  concepts.forEach(c => { if (!c.unitId || !units.some(u => u.id === c.unitId)) { const u = sortedU.filter(u => u.page <= (c.page || 1)).pop(); c.unitId = u?.id || null; } c.docId = doc.id; });
  if (!doc.subject) { const p1 = doc.pages[0]; const big = p1?.lines.slice().sort((a, b) => b.size - a.size)[0]; doc.subject = big && big.t.length <= 30 && !/^(제\s*\d+\s*[장절편부]|\d+\.|chapter|unit)/i.test(big.t) ? big.t : ''; }
  doc.units = units; doc.concepts = concepts; finalizeConcepts(concepts);
  UI.busyUpdate(tag + '플래시카드와 문제를 만드는 중…', 95);
  generateBank(doc); generateCards(doc);
}

  }, '다시 분석');
}

async function openPdf(docId, n, highlight, mode) {

    <div class="pdfview">${mode === 'text' ? `<div class="pagetext" id="ptxt">${p.text ? hl(p.text) : '<span class="muted">(텍스트 없음)</span>'}</div>

async function download(filename, data) {

  catch (e) { if (e && e.code === 'declined') { UI.toast('저장을 취소했어요'); return false; } if (e && e.code && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { UI.toast('저장 실패: ' + esc(e.message || e.code)); return false; } }
  try { const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true; }
  catch (e) { UI.toast('이 환경에서는 파일 저장이 막혀 있어요. 복사 버튼을 사용해 주세요.'); return false; }

  ];

function buildSim(c, pool, custom) {
  const exShown = c.examples?.[0]?.t || '';
  const opts = custom ? custom.options : shuffle([c, ...similarOthers(c, pool.filter(o => !(exShown && o.id !== c.id && norm(exShown).includes(norm(o.name)))), 2)]).map(o => o.name);
  const answer = custom ? custom.options[custom.answer] : c.name;
  const ex = c.examples?.[0];
  const situation = custom ? custom.situation : ex ? `모찌가 자료에서 이런 사례를 발견했어요: “${shortDef(maskTerm(ex.t, c), 110)}”` : `모찌의 공부 메모: “${shortDef(maskTerm(c.definition, c), 110)}”`;
  const q = custom ? custom.question : (ex ? '이 사례와 관련된 개념은 무엇일까요?' : '이 메모는 어떤 개념에 대한 설명일까요?');
  const scene = { dur: null, caption: '선택지를 눌러 결과를 확인해 보세요', html: actor('mochi', 'worry', 4, 4, 130, 'a-in-l', 0, { pose: 'think', prop: 'pencil' }) + actor('kong', 'surprised', 80, 4, 110, 'a-in-r', .3, { pose: 'idle' }) +
    `<div class="a-pop" style="position:absolute;left:22%;right:22%;top:5%;background:#FFFDF6;border:2px dashed var(--butter-d);border-radius:18px;padding:12px 16px;font-size:15px;animation-delay:.4s">${custom ? '<span class="chip">🤖 AI 가상 사례</span> ' : ''}${esc(situation)}<div class="jua" style="margin-top:6px">${esc(q)}</div></div>
    <div style="position:absolute;left:22%;right:22%;bottom:16%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${opts.map((o, i) => `<button class="btn a-up" style="animation-delay:${0.8 + i * 0.2}s" onclick="Anim.branch(${o === answer})">${esc(o)}</button>`).join('')}</div>`,
    right: { dur: 0, caption: '정답! 🎉', html: actor('mochi', 'excited', 8, 6, 150, 'jump', 0, { pose: 'jump' }) + actor('kong', 'cheer', 74, 6, 130, 'jump', 0, { pose: 'cheer', prop: 'star' }) + `<div class="a-pop" style="position:absolute;left:28%;right:28%;top:12%;background:var(--mint);border-radius:20px;padding:14px;text-align:center"><div class="jua" style="font-size:24px">정답: ${esc(answer)}</div><div style="font-size:14px">${esc(custom?.explain || shortDef(c.definition, 120))}</div><div class="small">근거 p.${c.page}</div><button class="btn sm white" style="margin-top:8px" onclick="Anim.load('sim',conceptById('${c.id}'))">다른 사례 다시</button></div>` },
    wrong: { dur: 0, caption: '괜찮아요, 다시 생각해 봐요', html: actor('mochi', 'worry', 8, 6, 140, 'wiggle', 0, { pose: 'think', prop: '' }) + actor('dubu', 'smile', 74, 6, 130, 'a-in-r', 0, { pose: 'hold', prop: 'book' }) + `<div class="a-pop" style="position:absolute;left:28%;right:28%;top:12%;background:#FFF0F3;border-radius:20px;padding:14px;text-align:center"><div class="jua" style="font-size:20px">아쉬워요! 정답은 ‘${esc(answer)}’</div><div style="font-size:14px">${esc(custom?.explain || '정의: ' + shortDef(c.definition, 110))}</div><button class="btn sm" style="margin-top:8px" onclick="Anim.go(0)">다시 도전</button></div>` } };
  return [{ dur: 3000, caption: '사례 시뮬레이션: 상황 속에서 개념을 찾아봐요', html: actor('mochi', 'grin', 30, 8, 160, 'a-pop', 0, { pose: 'wave' }) + bubble(`‘${esc(c.name)}’ 단원 사례 탐험 출발!`, 52, 14, 36, .6) }, scene];
}
async function aiSim(cid) {
  const c = conceptById(cid), d = docById(c.docId), pool = usable(d), sims = similarOthers(c, pool, 2);
  UI.toast('🤖 AI가 가상 사례를 만드는 중…');
  try {
    const r = await AI.json(`학교·일상 속 가상의 짧은 사례(2~3문장)를 만들고, 그 사례에 해당하는 개념을 고르는 문제를 만들어라. 정답은 「${c.name}」이고, 오답은 ${sims.map(s => `「${s.name}」`).join(', ')}이다. 사례는 아래 정의들에 비추어 정답이 하나만 맞도록 써라.
출력: {"situation":"사례","question":"질문","options":[${[c, ...sims].map(x => `"${x.name}"`).join(',')}],"answer":0,"explain":"왜 정답인지 정의 근거로 설명(80자 이내)"}
${[c, ...sims].map(x => `[${x.name}] ${x.definition}`).join('\n')}`, { tier: 'default' });
    const answer = r.options.findIndex(o => norm(o) === norm(c.name)); if (answer < 0) throw new Error('정답 확인 실패');
    Anim.stop();
    Anim.scenes = buildSim(c, pool, (() => { const o = shuffle(r.options); return { situation: r.situation, question: r.question, options: o, answer: o.findIndex(x => norm(x) === norm(c.name)), explain: r.explain }; })());
    Anim.i = 1; Anim.show();
  } catch (e) { UI.toast('AI 사례 생성 실패: ' + esc(e.message)); }
}

<script>

let FC = { docId: '', mode: 'due', swap: false, queue: [], i: 0, flipped: false, tab: 'study', active: false, sess: { n: 0, r: [0, 0, 0, 0] } };

  if (FC.mode === 'hard') cs = cs.filter(c => c.lapses > 0 || (c.history?.slice(-1)[0]?.r ?? 2) <= 1);
  if (FC.mode === 'wrong') cs = cs.filter(c => wrongCount(c.conceptId) > 0);

}

  if (!S.docs.length) { $('#main').innerHTML = header('🃏', '플래시카드') + needDoc(); return; }

  $('#main').innerHTML = header('🃏', '플래시카드', '문구점 암기 카드처럼! 카드를 누르면 뒤집혀요.', `<div class="tabs" style="margin:0"><span class="tab ${FC.tab === 'study' ? 'on' : ''}" onclick="FC.tab='study';render()">학습</span><span class="tab ${FC.tab === 'manage' ? 'on' : ''}" onclick="FC.tab='manage';render()">카드 관리</span></div>`) + `<div id="fcBody"></div>`;

    <div class="grid g2" style="margin-top:14px"><div><label>자료</label>${docPicker('fcDoc', FC.docId, 'FC.docId=this.value;render()', true)}</div>
      <div><label>학습 방식</label><select onchange="FC.mode=this.value;render()">${[['due', '📅 오늘 복습할 카드'], ['order', '🔢 순서대로'], ['shuffle', '🔀 카드 섞기'], ['hard', '😵 어려운 카드만'], ['wrong', '❗ 오답 개념 카드만']].map(([k, n]) => `<option value="${k}" ${FC.mode === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
    <label class="row" style="margin-top:10px;cursor:pointer"><input type="checkbox" ${FC.swap ? 'checked' : ''} onchange="FC.swap=this.checked"> 앞뒤 바꾸기 (정답 면 먼저 보기)</label>
    <div class="row" style="margin-top:14px"><button class="btn strong" onclick="fcStart()">🃏 학습 시작 (${cardPool().length}장)</button></div></div>`;
};
function fcStart() { const q = cardPool(); if (!q.length) { UI.toast(FC.mode === 'due' ? '오늘 복습할 카드가 없어요! 🎉 다른 학습 방식을 골라 보세요' : '조건에 맞는 카드가 없어요'); return; } FC.queue = q.map(c => c.id); FC.i = 0; FC.flipped = false; FC.active = true; FC.requeued = new Set(); FC.sess = { n: 0, r: [0, 0, 0, 0] }; render(); }

  if (st === 2) { const t = $('#awTxt').value; const hit = c.keywords.filter(k => kwHit(t, k)); ok = hit.length >= Math.ceil(c.keywords.length * .5); $('#awFb').innerHTML = `<div class="evidence">PDF 정의: ${highlightKw(c.definition, c.keywords)} ${pgLink(c.docId, c.page)}</div><div class="small">포함한 핵심어: ${hit.map(esc).join(', ') || '없음'} · 빠진 핵심어: <b style="color:#B03A48">${c.keywords.filter(k => !hit.includes(k)).map(esc).join(', ') || '없음'}</b></div><button class="btn sm" onclick="AW.step++;epAfterRender()">다음</button>`; }
  if (st === 3) { const q = AW.q3; ok = +v === q.answer; msg = (ok ? '정답! ' : `정답은 ‘${q.options[q.answer]}’예요. `) + (q.explanation || ''); }
  S.quizLog.push({ t: Date.now(), conceptId: c.id, correct: ok, level: st === 3 ? (AW.q3?.level || 3) : 2, type: 'comic-' + st, mode: 'comic' });
  if (!ok) addWrong(c.id, 'quiz', st === 1 ? '추론 과정 오류' : st === 3 ? '사례 적용 오류' : '정의가 부정확함', `만화 시청 후 확인 ${st + 1}단계`); else { touchReview(c.id, 2); reward(1, 4); }
  AW.res.score = (AW.res.score || 0) + (ok && st !== 2 ? 1 : 0); save();
  if (st === 2) return;
  $('#awBody').insertAdjacentHTML('beforeend', `<div class="feedback ${ok ? 'ok' : 'no'}">${ok ? '⭕' : '💭'} ${esc(msg)}<div style="margin-top:6px"><button class="btn sm" onclick="AW.step++;epAfterRender()">다음</button></div></div>`);
  $$('#awBody .opt').forEach(b => b.disabled = true);
}

/* ---------- AI 각본 (연결 시) + 같은 품질 점검 ---------- */
async function aiEpisode(conceptIds, genre, length) {
  const base = buildEpisode({ conceptIds, genre, length }); const G = GENRES[genre]; const cs = conceptIds.map(conceptById);
  const P = conceptPack(cs[0]);
  const r = await AI.json(`귀여운 동물 캐릭터 애니메이션 학습 에피소드 각본을 써라. 장르: ${G.name}. 분량: ${LENGTHS[length].name}(${LENGTHS[length].note}).
캐릭터 성격(말투가 서로 달라야 함): mochi(분홍 토끼, 호기심 많고 감정 풍부, 가끔 성급, 실수를 인정하고 성장), dubu(크림 곰, 차분·다정, 처음부터 정답을 알진 않음, 단서로 함께 해결), kong(햄스터, 성급·엉뚱한 코미디 담당이지만 무능하지 않고 때로 결정적 사실을 발견), lulu(라벤더 고양이, 냉철·새침, 날카로운 추론, 의외로 허당).
규칙: 첫 15초 안에 사건 시작 / 목표·방해 사건·의견 차이·예기치 못한 문제·발견·개념을 이용한 해결·결과 / 같은 구도 연속 금지 / 한 컷 최대 3명 / 말풍선 한 줄 34자 이내 / 대사만으로 설명하지 말고 행동(act)과 시각 단서(clue)를 쓴다 / 정답을 매번 같은 캐릭터가 말하지 않는다 / 개념 정의는 아래 [PDF]와 모순 금지, 정의 문장은 개념 카드(card)로만 보여준다.
구도 type: ${Object.keys(SHOT_TYPES).join('|')} · camera: ${Object.keys(CAMERAS).join('|')} · act: ${Object.keys(ACTS).join('|')} · mood: ${Object.keys(EXPR).join('|')} · pose: ${Object.keys(POSES).join('|')} · bg: ${Object.keys(BGNAME).join('|')} · music: warm|comedy|mystery|tense|adventure|sad · style(말풍선): say|shout|whisper|think
출력 JSON: {"title":"","goal":"","scenes":[{"name":"","bg":"","music":"","shots":[{"type":"","camera":"","tag":"goal|incident|hypothesis|conflict|turn|gag|choice|resolve|twist|ending","caption":"","actors":[{"who":"","mood":"","pose":"","x":10~90,"act":""}],"lines":[{"who":"","t":"","mood":"","style":""}],"clue":{"title":"","text":"PDF 문장 일부(개념명은 ○○로)","key":"핵심어"},"choice":{"q":"","options":[{"t":"개념명","ok":true}]},"card":{"name":"개념명"}}]}]}
choice 선택지는 [후보 개념] 이름만 쓰고 정답은 하나.
[PDF 개념] ${cs.map(c => `${c.name}(p.${c.page}): ${c.definition}`).join(' / ')}
[후보 개념] ${[P.c, P.S, P.O].filter(Boolean).map(x => x.name).join(', ')}
[단서로 쓸 핵심어] ${P.keys.join(', ')}`, { tier: 'complex' });
  const ep = Object.assign(base, { src: 'ai', title: r.title ? `${G.ic} ${String(r.title).slice(0, 40)}` : base.title, goal: r.goal || base.goal });
  const okE = (v, obj, d) => obj[v] ? v : d;
  ep.scenes = (r.scenes || []).map(sc => ({ name: sc.name || '장면', bg: okE(sc.bg, BGNAME, G.bgs[0]), music: ['warm', 'comedy', 'mystery', 'tense', 'adventure', 'sad', 'none'].includes(sc.music) ? sc.music : 'warm',
    shots: (sc.shots || []).map(sh => { const o = { type: okE(sh.type, SHOT_TYPES, 'wide'), camera: okE(sh.camera, CAMERAS, 'none'), tag: sh.tag || '', caption: sh.caption || undefined,
      actors: (sh.actors || []).filter(a => MASCOTS[a.who]).slice(0, 3).map(a => ({ who: a.who, mood: okE(a.mood, EXPR, 'smile'), pose: okE(a.pose, POSES, 'idle'), x: clamp(+a.x || 50, 8, 92), y: 10, s: 1, act: ACTS[a.act] ? a.act : '' })),
      lines: (sh.lines || []).filter(l => MASCOTS[l.who] && l.t).map(l => ({ who: l.who, t: String(l.t), mood: okE(l.mood, EXPR, 'smile'), style: ['say', 'shout', 'whisper', 'think'].includes(l.style) ? l.style : 'say' })) };
      if (sh.clue && sh.clue.text) o.clue = { title: sh.clue.title || '단서', text: maskTerm(String(sh.clue.text), P.c), key: sh.clue.key || '' };
      if (sh.card) { const c = cs.find(x => norm(x.name) === norm(sh.card.name || '')) || cs[0]; o.card = { cid: c.id }; }
      if (sh.choice && Array.isArray(sh.choice.options)) { const cand = [P.c, P.S, P.O].filter(Boolean); o.choice = { q: sh.choice.q || '어떤 개념일까?', options: cand.map(x => ({ t: x.name, ok: x.id === P.c.id, cid: x.id })) }; o.choice.options = shuffle(o.choice.options).map(op => ({ ...op, result: op.ok ? null : wrongBranch(P, op, ep.roles) })); }
      return o; }) })).filter(sc => sc.shots.length);
  if (!ep.scenes.length || !ep.scenes.flatMap(s => s.shots).some(s => s.card)) throw new Error('각본에 해결 장면이 없어요');
  if (!ep.scenes.flatMap(s => s.shots).some(s => s.choice)) { const last = ep.scenes[ep.scenes.length - 1]; const i = last.shots.findIndex(s => s.card); last.shots.splice(Math.max(0, i), 0, base.scenes[base.scenes.length - 1].shots.find(s => s.choice)); }
  return ep;
}

    ${list.length ? list.map(c => { const im = contentImpact([c.id]); return `<div class="list-item" style="display:block;margin-top:8px;background:${c.status === 'rejected' ? '#FFF6F6' : c.status === 'review' ? '#FFFBEE' : 'var(--cream)'}">
      <div class="row between"><div class="row"><b class="jua" style="font-size:17px">${esc(c.name)}</b>${c.alias ? `<span class="small muted">${esc(c.alias)}</span>` : ''}${stChip(c)}${confChip(c)}${c.edited ? '<span class="chip butter">사용자 수정</span>' : ''}${c.parentName ? `<span class="chip white">↳ ${esc(c.parentName)}의 하위</span>` : ''}${c.aiVerdict ? `<span class="chip" title="${esc(c.aiReason || '')}">🤖 ${{ concept: '학습 개념', not: '개념 아님', uncertain: '애매함' }[c.aiVerdict]}</span>` : ''}</div>
        <div class="row small"><select style="padding:2px" onchange="const x=conceptById('${c.id}');x.kind=x.kindUser=this.value;save()">${Object.entries(KINDS).map(([k, n]) => `<option value="${k}" ${c.kind === k ? 'selected' : ''}>${n}</option>`).join('')}</select><select style="padding:2px" onchange="const x=conceptById('${c.id}');x.importance=x.importanceUser=this.value;save()">${Object.entries(IMPORTANCE).map(([k, n]) => `<option value="${k}" ${c.importance === k ? 'selected' : ''}>중요도 ${n}</option>`).join('')}</select><select style="padding:2px;max-width:140px" onchange="conceptById('${c.id}').unitId=this.value||null;save()">${unitOpts(c.unitId)}</select></div></div>
      <div class="small" style="margin-top:4px"><b>정의</b> ${esc(c.definition)}</div>
      <div class="small muted">📄 ${esc(d.name)} · ${c.page ? pgLink(d.id, c.page) : '<span class="chip warn">출처 확인 필요</span>'} ${(c.sources || []).length > 1 ? `· 등장 ${[...new Set(c.sources.map(s => s.page).filter(Boolean))].map(p => 'p.' + p).join(', ')}` : ''} · 추출: ${{ ran: '정의 문장(~란)', isdef: '정의 문장(~은 …이다)', call: '정의 문장(~라고 한다)', colon: '용어: 설명', table: '표 구조', ai: 'AI 추출' }[c.extract] || c.source || '-'}</div>

/* --- 재분석: 바로 덮어쓰지 않고 전후 비교 → 승인한 것만 적용 --- */
let RDIFF = null;
async function reanalyzeDiff(docId) {
  const d = docById(docId); UI.busy('개선된 기준으로 개념을 다시 분석하는 중…');
  try {
    if (d.pages.some(p => p.status === 'fail' && /AI/.test(p.failReason || '')) && AI.ready) { d.pages.forEach(p => { if (p.status === 'fail') p.status = 'scan'; }); await ocrPages(d); }
    const shadow = Object.assign({}, d, { concepts: [] }); const { concepts } = await runConceptPipeline(shadow, AI.ready, (m, p) => UI.busyUpdate(m, p));
    const cur = new Map(d.concepts.map(c => [norm(c.name), c])); const nw = new Map(concepts.map(c => [norm(c.name), c]));
    const diff = { added: [], modified: [], remove: [], dup: [], review: [] };
    concepts.forEach(n => { const o = cur.get(norm(n.name));
      if (!o) { if (n.status === 'rejected') return; (n.status === 'review' ? diff.review : diff.added).push({ n, on: n.status === 'auto' }); }
      else { const ch = []; if (norm(o.definition) !== norm(n.definition)) ch.push('정의'); if ((o.kind || '') !== n.kind && !o.kindUser) ch.push('유형'); if ((o.page || null) !== (n.page || null)) ch.push('페이지'); if (o.status !== n.status && !o.statusUser) ch.push('상태');
        if (n.status === 'rejected' && o.status === 'rejected') {} else if (n.status === 'rejected' && !o.statusUser) diff.remove.push({ o, n, why: n.issues.map(x => x.msg).join(' · '), on: true });
        else if (ch.length) diff.modified.push({ o, n, ch, on: !o.edited }); }
      if (n.issues.some(x => x.code === 'badMerge' || x.code === 'duplicate')) diff.dup.push({ n }); });
    d.concepts.forEach(o => { if (!nw.has(norm(o.name)) && o.status !== 'rejected' && !o.edited && o.source !== 'user') diff.remove.push({ o, n: null, why: '새 분석에서 개념 후보로 나오지 않았어요', on: false }); });
    RDIFF = { docId, diff }; UI.close(); diffDialog();
  } catch (e) { UI.close(); UI.toast('재분석 실패: ' + esc(e.message)); }
}
function diffDialog() {
  const { diff } = RDIFF; const sec = (title, arr, row, k) => `<h4 style="margin:12px 0 4px">${title} <span class="muted small">${arr.length}</span></h4>${arr.length ? arr.map((x, i) => `<label class="list-item small" style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-bottom:4px">${k ? `<input type="checkbox" ${x.on ? 'checked' : ''} onchange="RDIFF.diff.${k}[${i}].on=this.checked">` : ''}<span class="grow">${row(x)}</span></label>`).join('') : '<div class="small muted">없음</div>'}`;
  UI.open(`<h3>🔁 재분석 결과 비교</h3><p class="small muted">아직 아무것도 바뀌지 않았어요. 적용할 항목만 고른 뒤 ‘선택한 변경 적용’을 누르세요. 사용자가 직접 고친 개념은 기본으로 유지돼요.</p>
    ${sec('🆕 새로 발견된 개념', diff.added, x => `<b>${esc(x.n.name)}</b> <span class="chip mint">자동 확정</span> ${esc(shortDef(x.n.definition, 90))} ${x.n.page ? 'p.' + x.n.page : ''}`, 'added')}
    ${sec('✏️ 수정된 개념', diff.modified, x => `<b>${esc(x.o.name)}</b> — 바뀐 항목: ${x.ch.join(', ')}${x.o.edited ? ' <span class="chip butter">사용자 수정본 (기본 유지)</span>' : ''}<div class="muted">전: ${esc(shortDef(x.o.definition, 70))} (p.${x.o.page || '-'})<br>후: ${esc(shortDef(x.n.definition, 70))} (p.${x.n.page || '-'})</div>`, 'modified')}
    ${sec('🗑 제외를 권장하는 개념', diff.remove, x => `<b>${esc(x.o.name)}</b> — ${esc(x.why)} <span class="muted">연결: ${impactText(contentImpact([x.o.id]))}</span>`, 'remove')}
    ${sec('👯 중복·병합 확인', diff.dup, x => `<b>${esc(x.n.name)}</b> — ${esc(x.n.issues.filter(i => ['badMerge', 'duplicate'].includes(i.code)).map(i => i.msg).join(' · '))}`, null)}
    ${sec('❓ 확인이 필요한 새 후보', diff.review, x => `<b>${esc(x.n.name)}</b> <span class="chip butter">검토 필요</span> ${esc(shortDef(x.n.definition, 80))} <span class="muted">${esc(x.n.confReason || '')}</span>`, 'review')}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn white" onclick="UI.close()">적용하지 않기</button><button class="btn strong" onclick="applyDiff()">선택한 변경 적용</button></div>`, true);
}
function applyDiff() {
  const d = docById(RDIFF.docId), { diff } = RDIFF; const changed = []; let n = 0;
  diff.added.concat(diff.review).filter(x => x.on).forEach(x => { x.n.docId = d.id; d.concepts.push(x.n); n++; });
  diff.modified.filter(x => x.on).forEach(x => { const keep = { id: x.o.id, statusUser: x.o.statusUser, kindUser: x.o.kindUser, importanceUser: x.o.importanceUser, unitId: x.o.unitId || x.n.unitId };
    Object.assign(x.o, x.n, keep); if (keep.statusUser) x.o.status = keep.statusUser; changed.push(x.o.id); n++; });
  diff.remove.filter(x => x.on).forEach(x => { x.o.status = 'rejected'; if (x.n) x.o.issues = x.n.issues; else x.o.issues = (x.o.issues || []).concat([{ code: 'notInSource', msg: x.why }]); changed.push(x.o.id); n++; });
  if (changed.length) markImpact(changed, '재분석으로 개념이 바뀌어 검토가 필요해요');
  d.pipeline = 2; finalizeConcepts(d.concepts); save(); UI.close(); RDIFF = null;
  UI.toast(`${n}건을 적용했어요. 기존 학습 기록은 그대로 두고, 관련 콘텐츠에 ‘검토 필요’를 표시했어요.`, 4000); render();
}
/* 기존 reanalyze 버튼 → 비교 흐름으로 */
function reanalyze(id) { reanalyzeDiff(id); }

.rm-dot.on{background:#5FD39A;box-shadow:0 0 0 3px #DDF8EA}
.rm-st{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700}
.rm-st.focus{background:#FFE1EA;color:#D2507A}.rm-st.break{background:#DDF5E9;color:#2E9C68}.rm-st.away{background:#FFF1BD;color:#A07B00}.rm-st.idle{background:#EEF3FF;color:#5B79C9}.rm-st.offline{background:#EFEAED;color:#8E8590}
.rm-big{font-family:'Jua',sans-serif;font-size:22px}
.rm-ctl .btn{min-width:92px}
.rm-bar{height:14px;border-radius:999px;background:#F6EEF2;overflow:hidden}.rm-bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
.rm-cal{display:grid;grid-template-columns:90px repeat(7,1fr);gap:4px;font-size:12px;align-items:center}
.rm-cal .c{height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px}
.rm-live{font-size:12px;border-radius:999px;padding:3px 10px;background:#DDF8EA;color:#2E9C68}
.rm-live.warn{background:#FFF1BD;color:#A07B00}.rm-live.bad{background:#FFE4E4;color:#C04848}
#rmMini{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;background:#fff;border-radius:999px;box-shadow:var(--shadow);border:2px solid var(--pink);padding:6px 10px 6px 14px;display:flex;gap:8px;align-items:center;font-size:13px}
#rmMini.hidden{display:none}
.rm-entry{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rm-pick{display:flex;gap:8px;flex-wrap:wrap}.rm-pick label{cursor:pointer;border-radius:18px;border:2px solid transparent;padding:4px;text-align:center;font-size:12px}
.rm-pick input{display:none}.rm-pick input:checked+div{outline:3px solid var(--pink);border-radius:16px;background:#FFF4F8}
.rm-pick .taken{opacity:.35;pointer-events:none}
@media (max-width:820px){.rm-cards,.rm-seats{grid-template-columns:repeat(2,1fr)}.rm-entry{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rm-seat .who,.rm-seat .who:after,.cupSteam,.rm-seat .zz{animation:none!important}}

<script>

const SUPABASE_URL = '';        // 예: 'https://abcdxyz.supabase.co'

const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

const RM = {
  cfg: null, sess: null, st: null, off: 0, recvAt: 0, ws: null, wsOk: false, wsTries: 0, hbT: null, pollT: null, tickT: null, refT: null, lastErr: '', hiddenAt: 0, autoAwayT: null, autoAwayDid: 0, busy: false,
  sandboxed() { return !!(window.claude && window.claude.use) || /claudeusercontent|claude\.ai/.test(location.hostname); },
  conf() {

  },
  async rpc(fn, args = {}) {
    const c = this.conf(); if (!c) throw new Error('NO_CONFIG');

    catch (e) { throw new Error('NETWORK'); }

    if (!r.ok) { const m = (j && j.message) || ('HTTP ' + r.status); const err = new Error(m); err.hint = j && j.hint; throw err; }

  },
  errText(e) { const m = e && e.message || String(e); if (m === 'NETWORK') return this.sandboxed() ? '이 화면(claude.ai 미리보기)에서는 외부 서버 연결이 막혀 있어요. GitHub Pages 등에 올린 파일로 열어 주세요.' : '서버에 연결하지 못했어요. 인터넷 연결이나 Supabase 주소를 확인해 주세요.'; if (m === 'NO_CONFIG') return '먼저 서버(Supabase) 연결 정보를 입력해 주세요.'; return ERR_KO[m] || (e.hint ? e.hint : '문제가 생겼어요: ' + m); },
  auth() { const s = this.sess; return { p_room: s.room_id, p_member: s.member_id, p_token: s.token }; },
  saveSess(s) { this.sess = s; if (s) LS.set('sb_session', s); else LS.del('sb_session'); },
  /* --- 서버 값 기준 시간 계산 --- */

  /* --- 현황 불러오기 --- */
  async refresh(quiet) {

    } catch (e) {

  kicked() { const name = this.st?.room?.name || '공부방'; this.stop(); this.saveSess(null); this.st = null; UI.open(`<h3>🚪 ${esc(name)}에 더 이상 접속할 수 없어요</h3><p>방장이 내보냈거나, 공부방이 삭제됐거나, 다른 기기에서 재입장 코드로 이 자리를 복구했어요.</p><p class="small muted">지금 기기에 저장된 개인 PDF·카드·퀴즈·시험 기록은 그대로 남아 있어요. 다시 들어가려면 방장에게 새 초대 코드나 재입장 코드를 받아 주세요.</p><div class="row" style="justify-content:flex-end"><button class="btn strong" onclick="UI.close();go('room')">확인</button></div>`); this.mini(); },
  /* --- 실시간: Supabase Realtime(WebSocket) 방송 채널. 받은 신호는 ‘바뀌었음’ 알림일 뿐이고, 내용은 항상 서버에서 다시 읽어요 --- */
  connectWS(channel) {
    this.channel = channel; try { this.ws && this.ws.close(); } catch (e) {} clearInterval(this.hbT); this.wsOk = false;
    const c = this.conf(); if (!c || !channel) return;
    let ref = 0; const topic = 'realtime:studybloom-' + channel; const send = o => { try { this.ws.readyState === 1 && this.ws.send(JSON.stringify(o)); } catch (e) {} };
    try { this.ws = new WebSocket(c.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(c.key) + '&vsn=1.0.0'); } catch (e) { return; }
    const ws = this.ws; this.topic = topic; this.send = send; this.nextRef = () => String(++ref);
    ws.onopen = () => { send({ topic, event: 'phx_join', payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false } }, ref: this.nextRef(), join_ref: '1' }); this.hbT = setInterval(() => send({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: this.nextRef() }), 25000); };
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.topic === topic && m.event === 'phx_reply' && m.payload?.status === 'ok' && !this.wsOk) { this.wsOk = true; this.wsTries = 0; this.paintLive(); }

    ws.onerror = () => {};
  },
  announce() { this.send && this.send({ topic: this.topic, event: 'broadcast', payload: { type: 'broadcast', event: 'changed', payload: {} }, ref: this.nextRef(), join_ref: '1' }); },
  start() {
    if (!this.sess) return; this.stop(true);
    this.refresh(true);

    this.tickT = setInterval(() => this.tick(), 1000);
  },
  stop(keep) { clearInterval(this.pollT); clearInterval(this.tickT); clearInterval(this.hbT); clearTimeout(this.autoAwayT); try { this.ws && (this.ws.onclose = null, this.ws.close()); } catch (e) {} this.ws = null; this.channel = null; this.wsOk = false; },
  tick() { document.querySelectorAll('[data-rmt]').forEach(el => { const [id, f] = el.dataset.rmt.split('|'); const m = this.st?.members.find(x => x.id === id); if (m) el.textContent = fmtHMS(this.liveSec(m, f)); });
    document.querySelectorAll('[data-rmg]').forEach(el => { const m = this.st?.members.find(x => x.id === el.dataset.rmg); if (m) { const p = Math.min(100, Math.round(this.liveSec(m) / 60 / m.daily_goal_min * 100)); el.style.width = p + '%'; const lb = el.parentElement.nextElementSibling; if (lb) lb.textContent = p + '%'; } });
    const team = $('#rmTeam'); if (team && this.st) team.textContent = fmtHMS(this.st.members.reduce((a, m) => a + this.liveSec(m), 0)); this.mini(true); },
  /* --- 내 상태 바꾸기 --- */
  async setState(state) {

    try { await this.rpc('sb_set_state', { ...this.auth(), p_state: state, p_subject: subj }); this.announce(); await this.refresh(true); SND && SND.pop && SND.pop(); }

  },
  /* --- 자리 비움 감지 (설정: 끄기 / 물어보기 / 자동 일시정지) --- */
  awayCfg() { return LS.get('sb_away', { mode: 'ask', min: 10 }); },
  onVis() {
    const me = this.myM(); const cfg = this.awayCfg();

    clearTimeout(this.autoAwayT); if (!this.sess) return; this.refresh(true);

      UI.open(`<h3>🪑 자리 비움으로 바꿔 두었어요</h3><p>화면을 ${cfg.min}분 넘게 보지 않아서 기록을 잠시 멈췄어요. 화면을 안 봤다고 공부를 안 했다는 뜻은 아니에요.</p><p class="small muted">멈춘 동안(약 ${mins}분) 다른 곳에서 공부했다면 그 시간을 기록에 더할 수 있어요. 더한 내용은 수정 기록에 남아요.</p>
        <div class="row" style="justify-content:flex-end"><button class="btn white" onclick="UI.close()">아니요</button><button class="btn mint" onclick="RM.editTime(0,${mins},'자리 비움 감지 중 공부(본인 확인)');UI.close()">${mins}분 더하기</button><button class="btn strong" onclick="UI.close();RM.setState('focus')">다시 집중 시작</button></div>`); return; }
    if (cfg.mode === 'ask' && me && me.state === 'focus' && gone >= cfg.min) { const mins = Math.round(gone);
      UI.open(`<h3>👀 ${mins}분 동안 화면을 보지 않았어요</h3><p>기록은 계속 이어지고 있어요. 그동안 계속 공부했나요?</p><div class="row" style="justify-content:flex-end"><button class="btn white" onclick="RM.editTime(0,-${mins},'자리 비움 시간 빼기(본인 확인)');UI.close()">아니요, ${mins}분 빼기</button><button class="btn strong" onclick="UI.close()">네, 계속 공부 중이었어요</button></div>`); }
  },
  async editTime(daysAgo, delta, reason) {

  },
  /* --- 미니 바: 다른 화면에서도 내 상태를 보고 바꿀 수 있어요 --- */
  mini(onlyTime) {
    let el = $('#rmMini'); if (!el) { el = document.createElement('div'); el.id = 'rmMini'; el.className = 'hidden'; document.body.appendChild(el); }
    const me = this.myM(); if (!this.sess || !me || VIEW === 'room') { el.classList.add('hidden'); return; }
    if (onlyTime && el.dataset.st === me.state) { const t = el.querySelector('b'); if (t) t.textContent = fmtHMS(this.liveSec(me)); return; }
    el.dataset.st = me.state; el.classList.remove('hidden');
    el.innerHTML = `${mascotIcon(me.character, 26)}<span class="rm-st ${me.state}">${ST_NAME[me.state]}</span> 오늘 <b>${fmtHMS(this.liveSec(me))}</b>

  },
  /* ===== 화면 ===== */
  paintLive() { const el = $('#rmLive'); if (!el) return; const ok = this.wsOk, err = this.lastErr;
    el.className = 'rm-live ' + (err ? 'bad' : ok ? '' : 'warn'); el.textContent = err ? '⚠ 연결 문제' : ok ? '● 실시간 연결됨' : '◌ 실시간 재연결 중 · 20초마다 서버 확인'; el.title = err || (ok ? 'Supabase Realtime으로 변경 알림을 받고 있어요' : '실시간 알림이 끊겨 20초마다 서버에서 직접 확인하고 있어요'); },
  paint() {

    const focusN = st.members.filter(m => m.state === 'focus' && m.online).length; const coop = st.room.mode === 'coop';
    const subjects = [...new Set(S.docs.map(d => d.subject).filter(Boolean))];
    const seat = m => { if (!m) return `<div class="rm-seat"><svg class="chair" viewBox="0 0 70 64"><rect x="12" y="6" width="46" height="34" rx="12" fill="#F7E6EE" stroke="#E6C9D6" stroke-width="2" stroke-dasharray="4 4"/><rect x="8" y="38" width="54" height="12" rx="6" fill="#F7E6EE" stroke="#E6C9D6" stroke-width="2" stroke-dasharray="4 4"/></svg><div class="desk"></div><div class="name muted">빈자리</div></div>`;

        : `<div class="who">${mascot(m.character, s === 'focus' ? 'focus' : s === 'break' ? 'happy' : s === 'offline' ? 'sleepy' : 'smile', 120, '', s === 'focus' ? { pose: 'hold', prop: m.character === 'lulu' ? 'paper' : m.character === 'mochi' ? 'notebook' : 'book' } : s === 'break' ? { pose: 'hold', prop: 'cup' } : { pose: 'idle', prop: '' })}</div>${s === 'offline' ? '<span class="zz">z z</span>' : ''}`;

  $('#main').innerHTML = header('🎨', '꾸미기 상점', '공부해서 모은 별로 나만의 공부방을 꾸며요. (장식은 시험 점수에 영향을 주지 않아요)', `<div class="stat"><b>⭐ ${S.profile.stars}</b><span>보유 별</span></div>`) + `
  <div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)"><div>${roomHTML()}<div class="card" style="margin-top:14px"><h3>🧸 마스코트 성장</h3><div class="row">${Object.keys(MASCOTS).map(k => `<div class="center">${mascot(k, 'grin', 70, '', { pose: 'wave' })}<div class="small"><b>${MASCOTS[k].name}</b> Lv.${level()}</div></div>`).join('')}</div><div class="small muted">학습 경험치 ${S.profile.xp} XP · 다음 레벨까지 ${Math.ceil(30 * level() ** 2 - S.profile.xp)} XP</div><div class="bar"><i style="width:${pct(S.profile.xp - 30 * (level() - 1) ** 2, 30 * level() ** 2 - 30 * (level() - 1) ** 2)}%"></i></div></div></div>
  <div class="card"><div class="list-item" style="cursor:pointer" onclick="go('friends')">${mascotIcon('lulu', 36, 'playful')}<span class="grow"><b>캐릭터 옷장은 ‘캐릭터 친구들’로 이사했어요</b><br><span class="small muted">의상 6종 · 액세서리 7종 · 표정과 포즈 구경하기</span></span>→</div>${Object.keys(SLOTNAME).map(slot => `<h4 style="margin:10px 0 6px">${SLOTNAME[slot]}</h4><div class="grid g3">${SHOP.filter(x => x.slot === slot).map(x => { const own = S.profile.owned.includes(x.id); const on = slot === 'outfit' ? S.profile.outfit === x.outfit : S.profile.placed[slot] === x.id;
    return `<div class="list-item shopitem" style="display:block;${on ? 'background:var(--pink)' : ''}"><div class="ic" style="height:40px;font-size:30px">${x.ic}</div><div class="small"><b>${x.name}</b></div>${own ? `<button class="btn xs ${on ? 'white' : 'mint'}" onclick="placeItem('${x.id}')">${on ? (['desk', 'chair', 'wall'].includes(slot) ? '사용 중' : '빼기') : '배치'}</button>` : `<button class="btn xs ${S.profile.stars >= x.price ? 'butter' : 'white'}" ${S.profile.stars >= x.price ? '' : 'disabled'} onclick="buyItem('${x.id}')">⭐${x.price}</button>`}</div>`; }).join('')}</div>`).join('')}</div></div>`;
};
function buyItem(id) { const x = SHOP.find(i => i.id === id); if (S.profile.stars < x.price) return; S.profile.stars -= x.price; S.profile.owned.push(id); placeItem(id, true); Dock.say('mochi', 'cheer', `${x.name} 구입! 공부방이 더 예뻐졌어요 ✨`); }
function placeItem(id, force) { const x = SHOP.find(i => i.id === id); if (x.slot === 'outfit') S.profile.outfit = (S.profile.outfit === x.outfit && !force) ? '' : x.outfit; else if (S.profile.placed[x.slot] === id && !force && !['desk', 'chair', 'wall'].includes(x.slot)) delete S.profile.placed[x.slot]; else S.profile.placed[x.slot] = id; save(); render(); $('#logoM').innerHTML = mascot('mochi', 'happy', 34); }

/* ===== [29] 시작 ===== */
function applyAnim() { const m = S.profile.animMode || 'on'; document.body.classList.toggle('noanim', m === 'off'); document.body.classList.toggle('reduceanim', m === 'reduce'); document.body.classList.toggle('forceanim', m === 'on' && S.profile.animForce); }
(async () => {
  await load();
  migrateCharacters(); migrateConcepts(); applyAnim(); RM.init();
  $('#animSel').value = S.profile.animMode;
  $('#restToggle').checked = S.profile.rest !== false;
  $('#animSel').addEventListener('change', e => { S.profile.animMode = e.target.value; applyAnim(); save(); render(); });
  $('#restToggle').addEventListener('change', e => { S.profile.rest = e.target.checked; save(); });
  $('#logoM').innerHTML = mascotIcon('mochi', 38, 'grin');
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') UI.close(); });
  const running = S.exams.find(e => e.status === 'running');
  render(); Dock.idle();
  if (running) UI.toast(`⏳ 진행 중인 시험 「${esc(running.title)}」이 있어요. 실전 시험장에서 이어서 응시할 수 있어요.`, 5000);
  if (!DB.ok) UI.toast('⚠️ 이 환경에서는 브라우저 저장소를 쓸 수 없어요. 자료실의 백업 기능으로 기록을 저장해 주세요.', 6000);
  if (!pdfReady()) UI.toast('PDF 도구(PDF.js)를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.', 6000);
  AI.init(); VOICE.init();
  if (!S.docs.length) setTimeout(() => Dock.say('mochi', 'happy', '반가워요! 저는 학습 계획 담당 모찌예요 🐰 PDF 자료실에서 강의자료를 올리면 바로 공부를 시작할 수 있어요.', 8000), 600);
})();
</script>
